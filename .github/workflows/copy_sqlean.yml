name: Sync All Incubator Assets
on:
  workflow_dispatch: # 網頁上手動點擊即可執行

permissions:
  contents: write # 確保腳本擁有寫入 Release 的權限

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      # 1. 下載 nalgeon/sqlean 的 incubator Release 所有檔案
      - name: Download All Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p download_assets
          gh release download incubator --repo nalgeon/sqlean --dir download_assets

      # 2. 升級至 v2 版本，支援最新 Node 環境並上傳所有檔案
      - name: Upload All Assets to My Repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'incubator'
          files: 'download_assets/*' # 匹配資料夾下的所有編譯檔案
          prerelease: true           # 標記為預發布版本
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
